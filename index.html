<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SDGs 性別平權</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #cce7ff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 50px);
            /* background-image: url('https://i.imgur.com/Lf0F6hB.jpg');  村莊背景圖 */
            background-color: #c5f8d7; 
            background-size: cover;
            background-position: center;
        }
        .hut {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: pointer;
        }
        /* 10 個 hut 的位置 */
        #hut1 { top: 50px; left: 50px; }
        #hut2 { top: 50px; left: 150px; }
        #hut3 { top: 50px; left: 250px; }
        #hut4 { top: 150px; left: 50px; }
        #hut5 { top: 150px; left: 150px; }
        #hut6 { top: 150px; left: 250px; }
        #hut7 { top: 250px; left: 50px; }
        #hut8 { top: 250px; left: 150px; }
        #hut9 { top: 250px; left: 250px; }
        #hut10 { top: 350px; left: 150px; }
        /* 題目彈窗 */
        #question-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            display: none;
            width: 300px;
        }
        #question-modal h3 {
            margin-top: 0;
        }
        #question-modal button {
            margin-top: 10px;
            display: block;
            width: 100%;
            padding: 5px;
            cursor: pointer;
        }
        #result-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            display: none;
            width: 300px;
            text-align: center;
        }
        #result-modal button {
            margin-top: 10px;
            padding: 5px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<header>
    <div>SDGs 性別平權</div>
    <div>答對題數: <span id="score">0</span>/10</div>
</header>

<div id="game-container">
    <!-- 10 個 hut icon -->
    <i class="fas fa-home hut" id="hut1" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut2" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut3" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut4" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut5" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut6" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut7" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut8" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut9" style="font-size: 80px; color: #8B4513;"></i>
    <i class="fas fa-home hut" id="hut10" style="font-size: 80px; color: #8B4513;"></i>
</div>

<!-- 題目彈窗 -->
<div id="question-modal">
    <h3 id="question-text"></h3>
    <div id="options-container"></div>
</div>

<!-- 結果彈窗 -->
<div id="result-modal">
    <h3 id="result-text"></h3>
    <button id="retry-btn" style="display:none;">重新挑戰</button>
    <button id="next-level-btn" style="display:none;" onclick="location.href='level2.html'">前往下一關</button>
</div>

<script>
const questions = [
    { q: "男女應該享有平等教育的權利嗎？", options: ["是", "否"], answer: 0 },
    { q: "職場上男性比女性優先升遷是正確的嗎？", options: ["正確", "錯誤"], answer: 1 },
    { q: "女性參政權是基本人權的一部分嗎？", options: ["是", "否"], answer: 0 },
    { q: "性別平等僅影響女性？", options: ["是", "否"], answer: 1 },
    { q: "家庭工作分擔應該由雙方共同承擔嗎？", options: ["是", "否"], answer: 0 },
    { q: "男性不適合從事護理工作？", options: ["是", "否"], answer: 1 },
    { q: "性別平權能促進社會發展？", options: ["是", "否"], answer: 0 },
    { q: "教育機會應基於能力而非性別？", options: ["是", "否"], answer: 0 },
    { q: "性別平等只是一種理想，不重要？", options: ["是", "否"], answer: 1 },
    { q: "所有人都應該享有平等工作機會？", options: ["是", "否"], answer: 0 }
];

let answeredQuestions = new Set();
let score = 0;

const scoreDisplay = document.getElementById('score');
const questionModal = document.getElementById('question-modal');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const resultModal = document.getElementById('result-modal');
const resultText = document.getElementById('result-text');
const retryBtn = document.getElementById('retry-btn');

const huts = document.querySelectorAll('.hut');
huts.forEach((hut, index) => {
    hut.addEventListener('click', () => openQuestion(index));
});

function openQuestion(index) {
    if(answeredQuestions.has(index)) return; // 已答過
    const q = questions[index];
    questionText.textContent = q.q;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.addEventListener('click', () => selectAnswer(index, i));
        optionsContainer.appendChild(btn);
    });
    questionModal.style.display = 'block';
}

function selectAnswer(index, selected) {
    questionModal.style.display = 'none';
    answeredQuestions.add(index);
    if(selected === questions[index].answer){
        score++;
        scoreDisplay.textContent = score;
    }
    if(answeredQuestions.size === questions.length){
        showResult();
    }
}

function showResult() {
    resultModal.style.display = 'block';
    if(score >= 8){
        resultText.textContent = `恭喜！你答對 ${score} 題，進入下一關！`;
        retryBtn.style.display = 'none';
        document.getElementById('next-level-btn').style.display = 'inline-block';
    } else {
        resultText.textContent = `你只答對 ${score} 題，請重新挑戰！`;
        retryBtn.style.display = 'inline-block';
        document.getElementById('next-level-btn').style.display = 'none';
    }
}

retryBtn.addEventListener('click', () => {
    location.reload();
});
</script>
</body>
</html>
